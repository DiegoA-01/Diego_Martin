<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/css/tienda.css">
    <title>Tienda</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="logo">
            <a href="inicial.html">Sport Shop</a>
        </div>

        <div class="menu">
            <a href="#">Camisetas</a>
            <a href="#">Guayos</a>
            <a href="#">Buzos</a>
            <a href="#">Pantaloetas</a>
        </div>

        <div class="acciones">
            <a href="carrito.html" class="carrito">Carrito 🛒</a>
        </div>
    </nav>

    <section class="productos">
        <h1>Tienda Deportiva</h1>

        <div class="grid">

            
            <div class="card">
                <img src="/src/assets/camiseta.jpg">
                <h3>Camiseta Deportiva</h3>
                <p>50.000</p>
                <button class="btn-agregar"
                    data-nombre="Camiseta Deportiva"
                    data-precio="50000"
                    data-imagen="/src/assets/camiseta.jpg">
                    Agregar
                </button>
            </div>

            
            <div class="card">
                <img src="/src/assets/guayos.jpg">
                <h3>Guayos Adidas F50 Profesionales</h3>
                <p>250.000</p>
                <button class="btn-agregar"
                    data-nombre="Guayos Adidas"
                    data-precio="250000"
                    data-imagen="/src/assets/guayos.jpg">
                    Agregar
                </button>
            </div>

            
            <div class="card">
                <img src="/src/assets/buzo.jpg">
                <h3>Buzo Deportivo</h3>
                <p>120.000</p>
                <button class="btn-agregar"
                    data-nombre="Buzo Deportivo"
                    data-precio="120.000"
                    data-imagen="/src/assets/buzo.jpg">
                    Agregar</button>
            </div>

            
            <div class="card">
                <img src="/src/assets/pantaloneta.jpg">
                <h3>Pantaloneta con licra</h3>
                <p>80.000</p>
                <button class="btn-agregar"
                    data-nombre="Pantaloneta con licra"
                    data-precio="80.000"
                    data-imagen="/src/assets/pantaloneta.jpg">
                    Agregar</button>
            </div>

            <div id ="toast" class="toast"></div>

            <script src="/src/js/carrito.js"></script>
    
</body>
</html>
