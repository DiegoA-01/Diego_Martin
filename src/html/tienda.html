<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/src/css/tienda.css">
    <title>Tienda</title>
     <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="logo">
            <a href="inicial.html">Sport Shop</a>
        </div>

        <div class="menu">
            <a href="#">Camisetas</a>
            <a href="#">Guayos</a>
            <a href="#">Buzos</a>
            <a href="#">Pantaloetas</a>
        </div>

        <div class="acciones">
            <a href="#" class="carrito">Carrito 🛒</a>
        </div>
    </nav>

    <section class="productos">
        <h1>Tienda Deportiva</h1>

        <div class="grid">

            <!--PRODUCTO 1-->
            <div class="card">
                <img src="/src/assets/camiseta.jpg" alt="">
                <h3>Camiseta Deportiva</h3>
                <p>50.000</p>
                <button>Agregar</button>
            </div>

            <!--PRODUCTO 2-->
            <div class="card">
                <img src="/src/assets/guayos.jpg" alt="">
                <h3>Guayos Adidas F50 Profesionales</h3>
                <p>250.000</p>
                <button>Agregar</button>
            </div>

            <!--PRODUCTO 3-->
            <div class="card">
                <img src="/src/assets/buzo.jpg" alt="">
                <h3>Buzo Deportivo</h3>
                <p>120.000</p>
                <button>Agregar</button>
            </div>

            <!--Producto 4-->
            <div class="card">
                <img src="/src/assets/pantaloneta.jpg" alt="">
                <h3>Pantaloeta con licra</h3>
                <p>80.000</p>
                <button>Agregar</button>
            </div>

            <script src="/src/js/carrito.js"></script>
    
</body>
</html>
